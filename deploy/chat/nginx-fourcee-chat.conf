# Add INSIDE the `server { server_name fourcee.lutho.app; ... listen 443 ssl }` block of /etc/nginx/sites-enabled/fourcee.lutho.app,
# ABOVE `location / { try_files ... /index.html }`.
location ^~ /api/chat {
  proxy_pass http://127.0.0.1:8787;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;          # the proxy trusts this only because CHAT_TRUST_PROXY=1 and it listens on 127.0.0.1
  proxy_set_header Authorization "";                # never forward browser credentials
  proxy_buffering off;                              # SSE: tokens must reach the browser as they arrive
  proxy_cache off;
  proxy_read_timeout 60s;
  client_max_body_size 40k;
  add_header Cache-Control "no-store" always;
}
