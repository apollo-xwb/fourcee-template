
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fourcee: AI Receptionist for Jewelers – Book More, Stress Less</title>
    <meta name="description" content="Tailored AI voice agent for jewelers: 24/7 bookings, estimates, order updates, CRM integration. Boost ROI with our premium solution." />
    <meta name="theme-color" content="#262626" />
    <meta property="og:title" content="Fourcee: AI Receptionist for Jewelers – Book More, Stress Less" />
    <meta property="og:description" content="Tailored AI voice agent for jewelers: 24/7 bookings, estimates, order updates, CRM integration. Boost ROI with our premium solution." />
    <meta property="og:type" content="website" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Michroma&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #ffffff;
        color: #262626;
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      .dark body {
        background-color: #090909;
        color: #f0f4f8;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(38,38,38,0.1);
      }
      .dark .glass-card {
        background: rgba(38,38,38,0.4);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      :root {
        --nav-dock-bottom: 1.25rem;
        --nav-dock-height: 3.75rem;
        --footer-nav-clearance: calc(var(--nav-dock-bottom) + var(--nav-dock-height) + 1.75rem);
      }
      .nav-floating {
        position: fixed;
        bottom: var(--nav-dock-bottom);
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
      }
      /* Keep terms / disclaimer above the fixed bottom dock */
      .footer-terms-clearance {
        padding-bottom: var(--footer-nav-clearance);
      }
      .shimmer-text {
        background: linear-gradient(to right, #262626 20%, #a4a4a4 40%, #a4a4a4 60%, #262626 80%);
        background-size: 200% auto;
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 4s linear infinite;
      }
      .dark .shimmer-text {
        background: linear-gradient(to right, #f0f4f8 20%, #a4a4a4 40%, #a4a4a4 60%, #f0f4f8 80%);
        background-size: 200% auto;
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      @keyframes shine {
        to { background-position: 200% center; }
      }
      input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 6px;
        background: #E5E7EB;
        border-radius: 10px;
      }
      .dark input[type=range]::-webkit-slider-runnable-track {
        background: #4a4a4a;
      }
      input[type=range]::-webkit-slider-thumb {
        height: 24px;
        width: 24px;
        border-radius: 50%;
        background: #262626;
        cursor: pointer;
        -webkit-appearance: none;
        margin-top: -9px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        border: 2px solid white;
      }
      .dark input[type=range]::-webkit-slider-thumb {
        background: #f0f4f8;
        border: 2px solid #262626;
      }
      /* App surface backgrounds: mobile vs large */
      .fourcee-surface-bg {
        background-color: #808080;
        background-blend-mode: saturation; /* desaturates the photo: black-and-white glass look */
        background-image: url('/assets/mobile-background.jpg');
        background-size: cover;
        background-position: center top;
        background-repeat: no-repeat;
      }
      @media (min-width: 768px) {
        .fourcee-surface-bg {
          background-image: url('/assets/large-background.jpg');
        }
      }
    </style>
